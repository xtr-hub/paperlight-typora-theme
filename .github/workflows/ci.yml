name: ci
on:
  push:
    tags:
      - "*" # 监听所有标签的推送
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取所有历史记录，以便比较标签

      - name: 获取当前的标签名
        id: get_tag_name
        run: |
          TAG_NAME=${GITHUB_REF##*/}  # 获取标签名，去掉 refs/tags/
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV  # 将标签名存储在环境变量中

      - name: 获取提交信息
        id: get_commits
        run: |
          # 获取上一个标签
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG=${GITHUB_REF##*/} # GITHUB_REF is refs/tags/<tag_name>

          # 计算提交数量
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found. Counting all commits up to ${CURRENT_TAG}."
            COMMIT_COUNT=$(git rev-list --count HEAD)
          else
            echo "Counting commits between ${PREVIOUS_TAG} and ${CURRENT_TAG}."
            # Use rev-list --count for direct counting
            COMMIT_COUNT=$(git rev-list --count ${PREVIOUS_TAG}..HEAD)
          fi
          echo "COMMIT_COUNT=${COMMIT_COUNT}" >> $GITHUB_ENV
          echo "Calculated commit count: ${COMMIT_COUNT}"

          # 获取提交列表 (用于发布说明)
          if [ -z "$PREVIOUS_TAG" ]; then
            # 如果没有上一个标签，获取所有提交
            ALL_COMMITS=$(git log --pretty=format:"%s|%h" --reverse HEAD)
          else
            # 获取从上一个标签到现在的所有提交
            ALL_COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s|%h" --reverse)
          fi

          # 过滤掉包含"Merge branch"、"docs:"和"README"的提交消息
          FILTERED_COMMITS=$(echo "$ALL_COMMITS" | grep -v -E "Merge branch|docs:|README")

          # 创建一个关联数组来存储每个提交消息的最新提交哈希
          declare -A commit_hashes

          # 遍历所有提交，为每个提交消息保存最新的哈希值
          while IFS="|" read -r message hash; do
            commit_hashes["$message"]="$hash"
          done <<< "$FILTERED_COMMITS"

          # 创建一个有序数组以保持提交的原始顺序
          declare -a ordered_messages=()
          declare -A seen_messages=()

          # 再次遍历所有提交，但只保留每个消息的第一个实例（保持顺序）
          while IFS="|" read -r message hash; do
            if [[ -z "${seen_messages[$message]}" ]]; then
              ordered_messages+=("$message")
              seen_messages["$message"]=1
            fi
          done <<< "$FILTERED_COMMITS"

          # 构建最终的提交列表，使用最新的哈希值
          FINAL_COMMITS=""
          for message in "${ordered_messages[@]}"; do
            hash="${commit_hashes[$message]}"
            FINAL_COMMITS+="- [${hash:0:7}] ${message}"$'\n'
          done

          # 直接保存提交信息到文件，保持每行一个提交
          echo "$FINAL_COMMITS" > release_notes.txt

          # 添加标题
          echo "### Commits" > complete_notes.txt
          echo "" >> complete_notes.txt
          cat release_notes.txt >> complete_notes.txt
          echo "" >> complete_notes.txt
          echo "[Full Changelog](https://github.com/xtr-hub/paperlight-typora-theme/commits/${{ github.ref }})" >> complete_notes.txt

          # 将提交信息保存到环境变量，用于后续步骤
          # 使用EOF方式确保多行文本正确保存
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          cat complete_notes.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 打包文件
        run: |
          echo ${{ env.TAG_NAME }}
          # 1) 全量包（包含 paperlight 目录下全部资源）
          zip -r paperlight-${{ env.TAG_NAME }}.zip ./paperlight.css ./paperlight-dark.css ./paperlight ./onelight.css ./onelight-dark.css

          # 2) 无图片包（排除 paperlight/img）
          zip -r paperlight-${{ env.TAG_NAME }}-noimg.zip ./paperlight.css ./paperlight-dark.css ./paperlight ./onelight.css ./onelight-dark.css \
            -x "paperlight/img/*" "paperlight/img/**"

          # 3) 无字体包（排除 paperlight/fonts）
          zip -r paperlight-${{ env.TAG_NAME }}-nofont.zip ./paperlight.css ./paperlight-dark.css ./paperlight ./onelight.css ./onelight-dark.css \
            -x "paperlight/fonts/*" "paperlight/fonts/**"

          # 4) 最小包（排除字体和图片）
          zip -r paperlight-${{ env.TAG_NAME }}-minimal.zip ./paperlight.css ./paperlight-dark.css ./paperlight ./onelight.css ./onelight-dark.css \
            -x "paperlight/fonts/*" "paperlight/fonts/**" "paperlight/img/*" "paperlight/img/**"

      - name: 创建发布并上传文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.TAG_NAME }}
        run: |
          # 已存在（例如手动创建）则复用，避免重复创建失败
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes-file complete_notes.txt \
              --verify-tag
          fi

          gh release upload "$TAG_NAME" \
            "paperlight-$TAG_NAME.zip" \
            "paperlight-$TAG_NAME-noimg.zip" \
            "paperlight-$TAG_NAME-nofont.zip" \
            "paperlight-$TAG_NAME-minimal.zip" \
            --clobber
